name: Build Ubuntu installers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Build Ubuntu packages
        run: npm run dist:linux

      - name: Upload Ubuntu installers
        uses: actions/upload-artifact@v7
        with:
          name: FloatLyrics-${{ github.sha }}-ubuntu-x64
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 30
