name: Build macOS installers

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - screenshots/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build macOS installers
        run: npm run dist:mac

      - name: Upload macOS installers
        uses: actions/upload-artifact@v7
        with:
          name: FloatLyrics-${{ github.sha }}-macos
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 30
