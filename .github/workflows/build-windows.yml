name: Build Windows installer

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - screenshots/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Windows installer
        run: npm run dist:win

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: FloatLyrics-${{ github.sha }}-windows-x64
          path: release/*-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 30
